<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .num-404 {
            font-size: 120px;
            font-weight: bold;
            color: #409eff;
            letter-spacing: 10px;
            animation: shake 2s infinite alternate;
        }
        @keyframes shake {
            0% {transform: translateY(0);}
            100% {transform: translateY(-10px);}
        }
        .tip-text {
            font-size: 20px;
            margin: 15px 0 30px;
            color: #666;
        }
        .back-btn {
            padding: 12px 36px;
            background: #409eff;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #337ecc;
        }
        /* 移动端适配 */
        @media(max-width:600px){
            .num-404{font-size:70px;}
            .tip-text{font-size:16px;}
        }
    </style>
</head>
<body>
    <div class="num-404">404</div>
    <p class="tip-text">抱歉，你访问的页面不存在或已被移除</p>
    <a href="/" class="back-btn">返回首页</a>
</body>
</html>
